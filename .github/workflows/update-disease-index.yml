name: Aktualizace indexu nemocí

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disease-index-update
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vygenerovat index nemocí
        run: node scripts/generate-disease-index.mjs

      - name: Ověřit aplikaci proti novému indexu
        run: |
          node --check assets/js/config.js
          node --check assets/js/app.js
          node --check scripts/generate-disease-index.mjs
          node --check scripts/verify-app.mjs
          node scripts/verify-app.mjs

      - name: Uložit aktualizovaný index do produkce
        shell: bash
        run: |
          if git diff --quiet -- assets/data/disease-index.json; then
            echo "Index se nezměnil."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/disease-index.json
          git commit -m "Update disease index"

          git pull --rebase origin main
          git push origin HEAD:main
